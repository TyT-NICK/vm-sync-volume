name: Release

# Push a tag like v1.0.0 to build VMVolumeSync.exe and publish it as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path VMVolumeSync.exe, README.md, LICENSE -DestinationPath "VMVolumeSync-${{ github.ref_name }}.zip"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" VMVolumeSync.exe "VMVolumeSync-${{ github.ref_name }}.zip" --title "${{ github.ref_name }}" --generate-notes
